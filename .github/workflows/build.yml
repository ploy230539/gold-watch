name: build dashboard

# Fallback path: a scheduled job on claude.ai writes only JSON into data/ (via a GitHub
# connector), and this workflow fills the template, validates it, and commits
# docs/index.html. That means the job never has to assemble HTML itself, which was the
# part that broke most often.
on:
  push:
    paths:
      - "data/**"
      - "template.html"
      - "gw.mjs"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # A payload carrying "log" is a morning brief, so also fill due results and append
      # today's row. Safe to re-run: rows are keyed by date_iso, so nothing duplicates.
      - name: Fill template and validate placeholders
        run: |
          if node -e "process.exit(require('./data/payload-latest.json').log ? 0 : 1)"; then
            node gw.mjs morning --in data/payload-latest.json
          else
            node gw.mjs build --in data/payload-latest.json
          fi

      - name: Commit and push
        run: |
          git add docs/ data/log.json
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to push"
            exit 0
          fi
          git config user.name "gold-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update dashboard and track record"
          git push
